name: Sync Telegram Channel with Images

on:
  schedule:
    - cron: '38 */4 * * *' # автоматический запуск каждые 2 часа
  workflow_dispatch:       # ручной запуск кнопкой во вкладке Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run Telegram sync script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python .github/scripts/sync_tg_bot.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.md "*.md" data.json feed.xml images/ files/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync Telegram posts and media" && git push)
